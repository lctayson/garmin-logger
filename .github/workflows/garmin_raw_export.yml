name: Raw Garmin Export

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to export (YYYY-MM-DD). Leave blank for today in Asia/Manila.'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '45 17 * * *'

permissions:
  contents: write

jobs:
  raw-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'garminconnect>=0.3.5' requests gspread oauth2client

      - name: Determine target date
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(TZ=Asia/Manila date +%Y-%m-%d)"
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $DATE"

      - name: Prepare Garmin token store
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.garminconnect"
          printf '%s' "$GARMIN_TOKENS_JSON" > "$HOME/.garminconnect/garmin_tokens.json"
          chmod 600 "$HOME/.garminconnect/garmin_tokens.json"

      - name: Export raw Garmin activity responses
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        shell: bash
        run: |
          set -euo pipefail
          python garmin_raw_export.py --date "${{ steps.target.outputs.date }}" --timezone Asia/Manila

      - name: Detect raw data changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain -- data/raw/)"
          if [ -z "$STATUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No raw Garmin data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Raw Garmin data changed."
            printf '%s\n' "$STATUS"
          fi

      - name: Commit raw Garmin data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          git config user.name "GitHub Action Bot"
          git config user.email "bot@github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No staged raw-data changes; nothing to commit."
            exit 0
          fi
          git commit -m "Export raw Garmin data for ${DATE}"
          git push
