name: Ensure Daily Garmin JSON

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to refresh (YYYY-MM-DD). Leave blank for today in Asia/Manila.'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/garmin_requests/**'

permissions:
  contents: write

jobs:
  ensure-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests gspread oauth2client

      - name: Determine target date
        id: target
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          elif [ -f .github/garmin_requests/date.txt ]; then
            DATE="$(cat .github/garmin_requests/date.txt | tr -d '[:space:]')"
          else
            DATE="$(TZ=Asia/Manila date +%Y-%m-%d)"
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $DATE"

      - name: Generate fresh Garmin JSON
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          echo "Always generating fresh Garmin data for $DATE"
          python run_garmin_to_json.py --date "$DATE"

      - name: Detect repository changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          STATUS="$(git status --porcelain -- "data/${DATE}.json" data/latest.json)"
          if [ -z "$STATUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful Garmin data changes detected. Nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Garmin data changed. A commit will be created."
            printf '%s\n' "$STATUS"
          fi

      - name: Commit changed Garmin data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          git config user.name "GitHub Action Bot"
          git config user.email "bot@github.com"
          git add "data/${DATE}.json"

          TODAY_PH="$(TZ=Asia/Manila date +%Y-%m-%d)"
          if [ "$DATE" = "$TODAY_PH" ] && [ -f data/latest.json ]; then
            git add data/latest.json
          fi

          if git diff --cached --quiet; then
            echo "No staged changes; nothing to commit."
            exit 0
          fi

          git commit -m "Refresh Garmin data for ${DATE}"
          git push
