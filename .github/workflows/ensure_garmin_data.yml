name: Ensure Daily Garmin JSON

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to refresh (YYYY-MM-DD). Leave blank for today in Asia/Manila.'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/garmin_requests/**'

permissions:
  contents: write

jobs:
  ensure-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests gspread oauth2client

      - name: Determine target date
        id: target
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          elif [ -f .github/garmin_requests/date.txt ]; then
            DATE="$(cat .github/garmin_requests/date.txt | tr -d '[:space:]')"
          else
            DATE="$(TZ=Asia/Manila date +%Y-%m-%d)"
          fi
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $DATE"

      - name: Generate fresh Garmin JSON and compare
        id: generate
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          FILE="data/${DATE}.json"
          TEMP="data/.${DATE}.json.new"

          echo "Generating fresh Garmin data for $DATE"
          python run_garmin_to_json.py --date "$DATE" --output "$TEMP"

          if [ ! -f "$TEMP" ]; then
            echo "Generator did not create $TEMP"
            exit 1
          fi

          python - "$FILE" "$TEMP" <<'PY'
          import json
          import os
          import sys

          existing_path, new_path = sys.argv[1:]

          def load(path):
              if not os.path.exists(path):
                  return None
              with open(path, encoding="utf-8") as f:
                  return json.load(f)

          def normalize(value):
              if isinstance(value, dict):
                  ignored = {
                      "generated_at",
                      "generation_timestamp",
                      "retrieved_at",
                      "retrieval_timestamp",
                  }
                  return {
                      k: normalize(v)
                      for k, v in value.items()
                      if k not in ignored
                  }
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value

          existing = load(existing_path)
          new = load(new_path)
          changed = existing is None or normalize(existing) != normalize(new)
          print(f"JSON changed: {changed}")

          if changed:
              os.replace(new_path, existing_path)
              print(f"Updated {existing_path}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("changed=true\n")
          else:
              os.remove(new_path)
              print(f"No Garmin data changes; {existing_path} unchanged")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("changed=false\n")
          PY

      - name: Update latest.json for today's Philippines date
        id: latest
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          TODAY_PH="$(TZ=Asia/Manila date +%Y-%m-%d)"

          if [ "$DATE" = "$TODAY_PH" ]; then
            cp "data/${DATE}.json" data/latest.json
            echo "Updated data/latest.json for current Philippines date: $DATE"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Historical date ($DATE); latest.json unchanged"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes only when data changed
        if: steps.generate.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.target.outputs.date }}"
          git config user.name "GitHub Action Bot"
          git config user.email "bot@github.com"
          git add "data/${DATE}.json"

          if [ "${{ steps.latest.outputs.updated }}" = "true" ]; then
            git add data/latest.json
          fi

          if git diff --cached --quiet; then
            echo "No staged changes; nothing to commit."
            exit 0
          fi

          git commit -m "Refresh Garmin data for ${DATE}"
          git push
