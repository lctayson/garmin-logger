name: Ensure Daily Garmin JSON

on:
  # Run periodically so a missing daily Garmin file is generated automatically.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to ensure (YYYY-MM-DD). Leave blank for today in Asia/Manila.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  ensure-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests gspread oauth2client

      - name: Determine target date
        id: target
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE="$(TZ=Asia/Manila date +%Y-%m-%d)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $DATE"

      - name: Generate Garmin JSON only if missing
        id: generate
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        shell: bash
        run: |
          DATE="${{ steps.target.outputs.date }}"
          FILE="data/${DATE}.json"

          if [ -f "$FILE" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "Garmin data already exists: $FILE"
            exit 0
          fi

          echo "Missing Garmin data: $FILE"
          echo "Generating it now..."
          python garmin_to_json.py --date "$DATE"
          echo "already_exists=false" >> "$GITHUB_OUTPUT"

      - name: Commit generated Garmin data
        if: steps.generate.outputs.already_exists == 'false'
        shell: bash
        run: |
          DATE="${{ steps.target.outputs.date }}"
          git config user.name "GitHub Action Bot"
          git config user.email "bot@github.com"
          git add "data/${DATE}.json" data/latest.json
          git commit -m "Ensure Garmin data for ${DATE}"
          git push
