name: Sync Garmin Metrics

on:
  schedule:
    - cron: '20 0 * * *'  # Runs daily at 8:20 AM Philippine Time (00:20 UTC)
  workflow_dispatch:      # Allows you to still run it manually anytime

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install garminconnect gspread oauth2client

      - name: Run Garmin to Sheets script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          python garmin_to_sheets.py
