name: Garmin to JSON Pipeline

on:
  repository_dispatch:
    types: [trigger-garmin-sync]
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch metrics for (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-garmin-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'garminconnect>=0.3.5' requests gspread oauth2client

      - name: Prepare Garmin token store
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.garminconnect"
          printf '%s' "$GARMIN_TOKENS_JSON" > "$HOME/.garminconnect/garmin_tokens.json"
          chmod 600 "$HOME/.garminconnect/garmin_tokens.json"

      - name: Run garmin_to_json.py
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python garmin_to_json.py --date "${{ inputs.date }}"
          else
            python garmin_to_json.py
          fi

      - name: Add date-aware Garmin naps
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python add_garmin_naps.py --date "${{ inputs.date }}"
          else
            python add_garmin_naps.py --date "$(date +%Y-%m-%d)"
          fi

      - name: Split daily and activity JSON
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python split_garmin_json.py --date "${{ inputs.date }}"
          else
            python split_garmin_json.py
          fi

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git commit -m "Auto-export daily telemetry JSON for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
