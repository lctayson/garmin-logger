name: Garmin to JSON Pipeline

on:
  schedule:
    # Runs daily at 8:20 AM Philippine Time (UTC+8) -> 00:20 UTC
    - cron: '20 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

# 👇 Add this permissions block so the bot is allowed to push changes
permissions:
  contents: write

jobs:
  run-exporter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests gspread oauth2client

      - name: Run garmin_to_json.py
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: python garmin_to_json.py

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          
          # Stage files inside the data directory
          git add data/*.json
          
          # Commit only if there are changes, otherwise exit gracefully
          git commit -m "Auto-export daily telemetry JSON for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
