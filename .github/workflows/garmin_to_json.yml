name: Garmin to JSON Pipeline

on:
  repository_dispatch:
    types: [trigger-garmin-sync]
  workflow_dispatch: # Allows manual runs as well
    inputs:
      date:
        description: 'Date to fetch metrics for (YYYY-MM-DD)'
        required: false
        default: '' # Leaves it blank so python defaults to today if not provided
        type: string

# Add this permissions block so the bot is allowed to push changes
permissions:
  contents: write

jobs:
  build-garmin-data:
    runs-on: ubuntu-latest
    steps:	
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect requests gspread oauth2client

      - name: Run garmin_to_json.py
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          # If a date was inputted in workflow_dispatch, pass it as an argument
          if [ -n "${{ inputs.date }}" ]; then
            python garmin_to_json.py --date "${{ inputs.date }}"
          else
            python garmin_to_json.py
          fi

      - name: Commit and Push Generated JSON
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          
          # Stage files inside the data directory
          git add data/*.json
          
          # Commit only if there are changes, otherwise exit gracefully
          git commit -m "Auto-export daily telemetry JSON for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
