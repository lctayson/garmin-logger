name: Garmin to JSON Pipeline

on:
  repository_dispatch:
    types: [trigger-garmin-sync]
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to fetch metrics for (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-garmin-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set export date
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.date }}" ]; then
            echo "EXPORT_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "EXPORT_DATE=$(python -c 'from datetime import datetime; from config import get_timezone; print(datetime.now(get_timezone()).date())')" >> "$GITHUB_ENV"
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'garminconnect>=0.3.5' requests gspread oauth2client

      - name: Prepare Garmin token store
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.garminconnect"
          printf '%s' "$GARMIN_TOKENS_JSON" > "$HOME/.garminconnect/garmin_tokens.json"
          chmod 600 "$HOME/.garminconnect/garmin_tokens.json"

      - name: Run garmin_to_json.py
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        run: |
          python run_garmin_to_json.py --date "$EXPORT_DATE"

      - name: Add Garmin Sleep Need
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        run: |
          python add_garmin_sleep_need.py --date "$EXPORT_DATE"

      - name: Add date-aware Garmin naps
        env:
          GARMIN_TOKENSTORE: ~/.garminconnect
        run: |
          python add_garmin_naps.py --date "$EXPORT_DATE"

      - name: Split daily and activity JSON
        run: |
          python split_garmin_json.py --date "$EXPORT_DATE"

      - name: Commit and Push Generated JSON
        run: |
          set -euo pipefail
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git commit -m "Auto-export daily telemetry JSON for $EXPORT_DATE" || echo "No changes to commit"

          git fetch origin main
          git rebase origin/main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push after $attempt attempts."
              exit 1
            fi
            echo "Push rejected; refreshing main and rebasing before retry $((attempt + 1))..."
            git fetch origin main
            git rebase origin/main
          done
